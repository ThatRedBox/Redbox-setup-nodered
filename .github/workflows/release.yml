name: Package
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gather required files
        run: |
          mkdir tempdir
          mv assets/ tempdir/
          mv config/ tempdir/
          cp edgeberry.json tempdir/
          cp scripts/uninstall.sh tempdir/
          chmod +x tempdir/uninstall.sh
          mv nodered/ tempdir/
          mv LICENSE.txt tempdir/

      - name: Keep edgeberry.json version in sync with release tag
        run: |
          tag="${{ github.event.release.tag_name }}"
          jq --arg version "${tag}" '.version = $version' tempdir/edgeberry.json > tempdir/edgeberry.json.tmp
          mv tempdir/edgeberry.json.tmp tempdir/edgeberry.json

      - name: Create tarball
        run: tar -C tempdir -zcvf package.tar.gz .

      - name: Extract project name
        id: project_name
        run: |
          # grab the repo name (after the slash) and export as a step output
          echo "name=$(basename ${{ github.repository }})" >> $GITHUB_OUTPUT

      - name: Rename package
        run: |
          mv package.tar.gz ${{ steps.project_name.outputs.name }}-${{ github.event.release.tag_name }}.tar.gz

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.project_name.outputs.name }}-${{ github.event.release.tag_name }}.tar.gz
            scripts/install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
