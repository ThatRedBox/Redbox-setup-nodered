# --------------------------------------------------------------------------------
# redbox.conf — Redbox overrides for the Node-RED service
#
# Purpose:
#   - Point Node-RED at the Redbox settings and data directories
#   - Start Node-RED after Edgeberry Core
#
# Location: /etc/systemd/system/nodered.service.d/redbox-nodered-service.conf
#
# NOTE: Any changes here take precedence over the upstream unit in
#       /lib/systemd/system/nodered.service.
# --------------------------------------------------------------------------------

[Unit]
Description=Node-RED for Redbox

# Start after Edgeberry Core.
#
# Edgeberry Core registers the application from /opt/Redbox/edgeberry.json when
# it starts. A flow that publishes its own application info - the routes the
# Edgeberry interface uses to reach a dashboard and the editor - competes with
# that registration, and whichever happens last wins. On a cold boot where
# Node-RED started first, the flow's routes were overwritten and the interface
# showed "No application running".
#
# Ordering Node-RED after Core puts Core's manifest registration first, and
# Node-RED spends more than ten seconds loading its palette after that, which
# leaves a wide margin.
#
# Wants, not Requires: whatever this box is automating must keep running even
# if Edgeberry Core is stopped or fails. Only the web interface depends on
# Core - never the flows.
Wants=io.edgeberry.core.service
After=io.edgeberry.core.service

[Service]
ExecStart=
ExecStart=/usr/bin/env node-red-pi --userDir /opt/Redbox/nodered $NODE_OPTIONS -- $NODE_RED_OPTIONS
